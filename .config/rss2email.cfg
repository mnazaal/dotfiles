email-protocol = imap
imap-server = imap.gmail.com
imap-port = 993
imap-ssl = True
imap-auth = True
imap-username = __RSS2EMAIL_PRIMARY_EMAIL__
imap-password = __RSS2EMAIL_IMAP_PASSWORD__

# Vim-style keybindings.
setw -g mode-keys vi
bind-key -r h select-window -t :-
bind-key -r l select-window -t :+
bind-key -r j select-pane -t :.+
bind-key -r k select-pane -t :.-
set-option -g repeat-time 750
bind-key x kill-pane # kill panes without asking for confirmation
bind-key C-p display-popup -E -d "$HOME" "scratch-ipython"

# Copy to the clipboard.
set -g set-clipboard on
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

bind-key -n C-S-Enter setw synchronize-panes
bind-key -n C-Enter send-keys Escape "[13;5u"
bind-key -n S-Enter send-keys Escape "[13;2u"
set -g extended-keys always
set -as terminal-features 'xterm*:extkeys'

# Reload the config quickly.
bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display "Configuration reloaded"

# Terminal integration.
set -as terminal-features ',xterm-256color:clipboard:extkeys'
# Use tmux's own terminfo inside tmux; tmux translates to the outer terminal.
set-option -g default-terminal "tmux-256color"
# Advertise Kitty synchronized updates so TUIs can redraw without flicker.
set -as terminal-features ',xterm-kitty:sync'
# Force RGB for all terminals.
set-option -sa terminal-overrides ',*:RGB'
set -as terminal-features ',*:usstyle'
set -as terminal-overrides ',xterm*:Smulx=\E[4::%p1%dm'
# Enable passthrough for Kitty-capable tmux builds.
# Older tmux releases (for example 3.2a on some HPC systems) do not
# support this option. The -q flag makes unsupported versions ignore it
# quietly instead of aborting config loading or showing an error.
set -gq allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ga update-environment COLORTERM
# Preserve Kitty environment variables for graphics support.
set -ga update-environment KITTY_INSTALLATION_DIR
set -ga update-environment KITTY_PID
set -ga update-environment KITTY_WINDOW_ID
set -ga update-environment KITTY_PUBLIC_KEY

# Status line styling.
set -g status-fg white
set -g status-bg black
set -g status-left ' #[bold]#S · '
set -g status-right '#[bold]#H '
set-window-option -g window-status-format '#I:#W'
set-window-option -g window-status-current-format '#[bold,italics,underscore]#I:#W'

# Start window numbering at 1.
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Sensible tmux defaults.
set -g history-limit 50000
set -g display-time 4000
set -s escape-time 5
set -g status-keys emacs
set -g focus-events on

# Split panes in the current directory.
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# Enable mouse support.
set -g mouse

# Open emacsclient in a new window.
bind-key C-e new-window -n emacs "emacsclient -nw -a ''; tmux kill-window"

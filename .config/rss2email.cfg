[DEFAULT]
from = RSS Feeds <__RSS2EMAIL_PRIMARY_EMAIL__>
user-agent = rss2email/__VERSION__ (__URL__)
use-8bit = False
force-from = True
use-publisher-email = False
name-format = {feed-title}: {author}
to = __RSS2EMAIL_RSS_EMAIL__
proxy =
feed-timeout = 60
same-server-fetch-interval = 0
active = True
digest = False
digest-type = multipart/digest
date-header = True
date-header-order = modified, issued, created, expired
bonus-header =
trust-guid = True
trust-link = False
reply-changes = False
encodings = US-ASCII, ISO-8859-1, UTF-8, BIG5, ISO-2022-JP
post-process =
digest-post-process =
subject-format = [RSS] {feed-title}
html-mail = False
multipart-html = False
unicode-snob = False
links-after-each-paragraph = False
inline-links = True
wrap-links = True
body-width = 0
email-protocol = imap
imap-server = imap.gmail.com
imap-port = 993
imap-ssl = True
imap-auth = True
imap-username = __RSS2EMAIL_PRIMARY_EMAIL__
imap-password = __RSS2EMAIL_IMAP_PASSWORD__
imap-mailbox = RSS
sendmail = __RSS2EMAIL_SENDMAIL__
sendmail_config =
verbose = info

[feed.hn]
url = https://hnrss.org/frontpage

[feed.eff]
url = https://www.eff.org/rss/updates.xml

[feed.jmlr]
url = http://www.jmlr.org/jmlr.xml

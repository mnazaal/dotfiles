# Send the proxy's stdout/stderr to a file rather than the journal, so
# `headroom` output can be read with the same tools as the cron logs.
#
# Tracked deliberately, and separately from override.conf: `headroom install
# apply` regenerates the unit and its own env block, and this file existed
# untracked beside override.conf until 2026-09-09 -- a rebuild from the
# repository would have restored the environment and silently dropped the log
# file. Keeping the path in the repository means stow collides with any
# untracked copy and `make check` names it.
[Service]
StandardOutput=append:%h/.local/state/headroom/service.log
StandardError=append:%h/.local/state/headroom/service.log

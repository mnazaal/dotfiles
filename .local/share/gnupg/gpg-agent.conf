# Cron jobs (calendar sync, mbsync, rss2email) decrypt pass entries with no tty
# and no display, so they cannot answer a pinentry prompt. On the stock defaults
# (default-cache-ttl 600, max-cache-ttl 7200) the passphrase was dropped at most
# two hours after each interactive unlock, and every cron job then failed
# silently until the next manual unlock.
# default-cache-ttl is a sliding window refreshed on every use, so the
# 10-minute calendar cron alone keeps an entry alive. max-cache-ttl is a HARD
# cap measured from the interactive unlock and cannot be refreshed, so at 86400
# the passphrase died exactly 24h after each unlock no matter how recently it
# had been used, and every cron job failed until the next manual unlock. The
# log showed that as clockwork: each failure window began 24h (+/- one cron
# tick) after the previous one ended, with no reboot in between.
#
# The cap is now long enough not to fire in a normal uptime. This keeps the
# passphrase in agent memory for that long, which is the deliberate trade for
# unattended cron decryption; gpg-agent still forgets everything when it
# restarts, so a reboot or `gpgconf --kill gpg-agent` costs one interactive
# unlock.
default-cache-ttl 34560000
max-cache-ttl 34560000

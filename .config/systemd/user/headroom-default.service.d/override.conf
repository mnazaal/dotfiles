# Headroom proxy: keep the lossy compression layer OFF.
#
# WHY THIS FILE EXISTS. Six variables switch Headroom off its stock `coding`
# savings profile, whose lossy layer rewrites request bodies: it drops function
# words and whole command tokens from skill text and tool output, and returns
# Read results as cross-turn dedup pointers instead of the file's bytes. They
# were set in ~/.config/zsh/.zshenv on 2026-08-12, which worked while the proxy
# was spawned from a shell by a launcher.
#
# On 2026-09-06 the proxy became a systemd user service. A service does not read
# .zshenv, so all six were silently lost: the proxy reverted to `coding`, agent
# input was being garbled again, and requests carrying deferred-tool references
# started failing with `400 Tool reference ... not found in available tools`.
# Found 2026-09-07 from the proxy's own /health.
#
# WHY A DROP-IN. `headroom install apply` regenerates headroom-default.service
# and run-headroom.sh, and writes their env from a fixed five-key block in its
# manifest that ignores the ambient environment — so neither the unit nor the
# shell can carry these. It does not touch a .service.d/ drop-in, so this
# survives every re-apply and every headroom upgrade.
#
# WHAT MAY GO HERE. run-headroom.sh exports HEADROOM_PORT, HOST, MODE, BACKEND
# and TELEMETRY *inside* the process, which overrides anything systemd sets, so
# setting those here would silently do nothing. Only variables absent from that
# script — the seven below — take effect.
#
# HEADROOM_LOSSLESS is a SECOND, separate layer. The six variables above move
# the proxy off its lossy `coding` savings profile, which is what garbles skill
# text and user messages. They do NOT govern CCR, the cross-turn retrieval layer
# that compacts TOOL OUTPUT: with savings_profile=general and
# compress_user_messages=false confirmed, tool results still came back dropping
# function words mid-sentence, with footers like `[151 words compressed to 107
# ... Retrieve more: hash=...]` and cross-turn pointers `[^5L same as msg 191]`.
# Read results that are not byte-exact are the dangerous form: an agent then
# edits from a stale view of a file. `--lossless` keeps the compaction but makes
# it format-native and lossless, and emits no retrieval marker, so no MCP
# retrieve tool is needed. `HEADROOM_NO_CCR=1` is the bigger hammer if footers
# survive this.
#
# VERIFY after any change to the deployment (the pid must change too):
#   curl -s http://127.0.0.1:8787/health | python3 -m json.tool \
#     | grep -E 'pid|savings_profile|compress_user'
# Want savings_profile: general, compress_user_messages: false.
#
# The tool-output half needs its own check, and it MUST use content the proxy
# has never seen: the CCR store replays a previous identical command's
# compressed blob with the same hash marker whatever the current settings are,
# so re-running an old command shows the bug after it is fixed. Generate
# something novel and read it back, then look for a compression footer:
#   head -c 4000 /dev/urandom | base64 > /tmp/novel-$$.txt; cat /tmp/novel-$$.txt
#
# NOT tracked by this repo: the generated unit, run-headroom.sh and the deploy
# profile under ~/.local/state/headroom/deploy/. On a new machine run
# `headroom install apply --preset persistent-service` once to create them; this
# drop-in is deployed by `make link` and applies from the next daemon-reload.

# Logging lives in the sibling logging.conf, tracked since 2026-09-09. It was
# an UNTRACKED second drop-in until then, so a rebuild from this repository
# would have restored every variable below and silently lost the proxy's log
# file -- the loss this file was written to prevent, one directory entry over.
# Tracking its path rather than folding it in here is deliberate: stow then
# collides with an untracked copy and `make check` names the file to delete,
# including if `headroom install apply` ever regenerates it.

[Service]
Environment=HEADROOM_SAVINGS_PROFILE=general
Environment=HEADROOM_TOOL_SEARCH=1
Environment=HEADROOM_PROTECT_READS=1
Environment=HEADROOM_DISABLE_KOMPRESS=1
Environment=HEADROOM_DISABLE_KOMPRESS_FALLBACK=1
Environment=HEADROOM_WORKSPACE_DIR=%h/.local/state/headroom
Environment=HEADROOM_LOSSLESS=1

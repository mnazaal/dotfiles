[DEFAULT]
from = RSS Feeds <__RSS2EMAIL_PRIMARY_EMAIL__>
user-agent = rss2email/__VERSION__ (__URL__)
use-8bit = False
force-from = True
use-publisher-email = False
name-format = {feed-title}: {author}
to = __RSS2EMAIL_RSS_EMAIL__

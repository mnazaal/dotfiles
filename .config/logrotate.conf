# Rotation for the logs this repository's cron jobs and services append to.
#
# @HOME@ is expanded by .local/scripts/logrotate-cron before logrotate reads
# this: logrotate does NOT expand `~` or environment variables in a pattern --
# it takes "~/.local/state/*.log" literally and matches nothing -- and writing
# the home path out would pin this file to one machine.
#
# copytruncate throughout, because two writers hold their log open across a
# rotation: the systemd `append:` streams for the headroom proxy, and the
# onedrive client during a sync. Renaming out from under them would leave both
# writing to an unlinked inode, which looks exactly like logging having stopped.

@HOME@/.local/state/*.log {
	size 10M
	rotate 4
	compress
	delaycompress
	missingok
	notifempty
	copytruncate
}

@HOME@/.local/state/onedrive/*.log {
	size 10M
	rotate 4
	compress
	delaycompress
	missingok
	notifempty
	copytruncate
}

@HOME@/.local/state/headroom/service.log {
	size 10M
	rotate 4
	compress
	delaycompress
	missingok
	notifempty
	copytruncate
}

## Keep Bluetooth headphones on the high-quality A2DP profile by default.
##
## WirePlumber's default Bluetooth autoswitch changes to the headset/HFP profile
## whenever an application opens the headset microphone. That profile is
## bidirectional, but low-quality for playback. Disable the automatic switch so
## the mic profile is only used when selected manually.

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
  bluetooth.use-persistent-storage = true
}

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        ## Prefer high-quality playback connection; headset profiles remain
        ## available for manual selection when microphone use is needed.
        bluez5.auto-connect = [ a2dp_sink hfp_hf hsp_hs ]
      }
    }
  }
]

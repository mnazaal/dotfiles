# key name refer to `xev` or `wev` command output.
# mod keys name: super, ctrl, alt, shift, none
# Simple Mango workflow: tags via keybinds, no workspace bar.

# Session / app launch.
bind=SUPER,r,reload_config
bind=SUPER,Return,spawn_shell,$HOME/.local/bin/kitty
bind=SUPER,d,spawn_shell,zsh -c 'source ~/.config/zsh/.zshenv; exec rofi -show combi'
bind=SUPER,w,spawn_shell,zsh -c 'source ~/.config/zsh/.zshenv; exec rofi -show window'
bind=SUPER,e,spawn_shell,zsh -c 'source ~/.config/zsh/.zshenv; exec nautilus --no-default-window'
bind=SUPER,Escape,spawn_shell,exec "$HOME/.local/scripts/lock-screen"
bind=SUPER,p,spawn_shell,$HOME/.local/bin/kitty --single-instance --instance-group quickshell --title quickshell

# Client / layout actions.
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,q,quit,
bind=SUPER,v,togglefloating,
bind=SUPER,f,togglefullscreen,
bind=NONE,F11,togglefullscreen,
bind=SUPER+SHIFT,space,switch_layout
bind=SUPER,Tab,focusdir,next
bind=SUPER,n,exchange_stack_client,next

# Focus movement.
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

# Monitor focus movement.
bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right

# Monitor focus / move between monitors.
bind=SUPER+SHIFT,h,focusmon,left
bind=SUPER+SHIFT,l,focusmon,right
bind=SUPER+SHIFT,j,tagmon,left
bind=SUPER+SHIFT,k,tagmon,right

# Tags: treat tags 1-5 like simple workspaces.
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0

bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5

# Mouse move / resize.
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Screenshots: save and copy to clipboard.
bind=NONE,Print,spawn_shell,$HOME/.local/scripts/screenshot full
bind=SHIFT,Print,spawn_shell,$HOME/.local/scripts/screenshot region
bind=SUPER,s,spawn_shell,$HOME/.local/scripts/screenshot full
bind=SUPER+SHIFT,s,spawn_shell,$HOME/.local/scripts/screenshot region

# Media keys.
bind=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMicMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness.
bind=NONE,XF86KbdBrightnessUp,spawn_shell,brightnessctl -d '*::kbd_backlight' set +33%
bind=NONE,XF86KbdBrightnessDown,spawn_shell,brightnessctl -d '*::kbd_backlight' set 33%-
bind=NONE,XF86MonBrightnessUp,spawn_shell,brightnessctl set +10%
bind=NONE,XF86MonBrightnessDown,spawn_shell,brightnessctl set 10%-

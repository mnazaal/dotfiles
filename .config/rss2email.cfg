# ---------------------------------------------------------------------------
# arXiv: one feed for the whole research area.
#
# Hits the arXiv *API* (export.arxiv.org/api/query), not the per-category RSS:
# the API takes a boolean query, so the firehose is filtered server-side. Atom
# comes back with a stable per-entry <id>, which `trust-guid = True` dedupes on.
#
# ~11 papers/week. This is the union of eleven separately-measured topic
# queries -- Bayesian experimental design, amortized/non-myopic design,
# Bayesian structure learning, CI testing, causal BO and bandits, expert and
# preference elicitation, counterfactual semantics and causal abstraction,
# simulation-based inference, colored-noise exploration, program synthesis and
# MDL, and semantic entropy. Verified as a true superset of all eleven: of
# their combined recent hits, the union drops exactly one, and that one was a
# cs.CV false positive containing none of the queried phrases.
#
# STRUCTURE, and why it is not just a flat OR:
#   (specific-phrases OR gated-clauses) AND (category union)   OR   (exempt-phrases)
# Some terms only behave when paired -- "simulation-based inference" alone
# returns epidemics and recommender papers, so it is gated on a causal/design
# word; "colored noise" is gated on exploration/planning or it returns
# signal-processing work. A few phrases are specific enough to need no category
# gate at all, and MUST stay outside it: "grammar-constrained decoding" papers
# post to cs.SE, which no sensible category union would include.
#
# CAVEAT: arXiv's quoted-phrase matching narrows hard but is NOT exact --
# abs:"expert reliability" returns papers whose abstracts lack the phrase (9
# hits vs 2989 unquoted, so quoting still does most of the work). Expect a
# minority of off-topic hits; that is arXiv, not the query.
#
# Terms measured and REJECTED as too noisy: "design policy" (government
# policy), "active learning"+Bayesian (classical DoE), "optimal intervention"
# and "soft intervention" (clinical), "expert knowledge" and "human-in-the-loop"
# standalone (moral-AI, agents), "pairwise comparisons" (video-gen eval),
# "in-context learning"+calibration (tabular anomaly detection),
# "self-consistency" (financial NER; took one clause 0.2 -> 1.9/wk alone).
#
# Inbox tagging: flat `[arXiv]` subject tag, sender "arXiv machine-learning".
# rss2email composes From as formataddr((name-format, address)) and
# `force-from` pins only the ADDRESS, so the display name is a free channel.
#
# RETUNING: widen by dropping an AND clause, narrow by adding one, and
# re-measure before committing -- check totalResults and read a sample of
# titles AND abstracts. Renaming this SECTION is not free: _load_feeds keys
# saved state by feed name, so a rename orphans the seen-set and re-sends the
# whole backlog. Re-seed after any rename with:
#     rss2email-cron run --no-send arxiv-ml
# Deleting a feed from the config is ALSO not enough -- an orphaned feed keeps
# its saved URL and falls back to [DEFAULT], so it goes on fetching silently.
# Remove it properly with `rss2email-cron delete <name>`.
# ---------------------------------------------------------------------------

[feed.arxiv-ml]
url = https://export.arxiv.org/api/query?search_query=%28%28%28abs%3a%22Bayesian+experimental+design%22+OR+abs%3a%22optimal+experimental+design%22+OR+abs%3a%22expected+information+gain%22+OR+abs%3a%22sequential+experimental+design%22+OR+abs%3a%22adaptive+experimental+design%22+OR+abs%3a%22deep+adaptive+design%22+OR+abs%3a%22amortized+experimental+design%22+OR+abs%3a%22amortised+experimental+design%22+OR+abs%3a%22non-myopic+experimental+design%22+OR+abs%3a%22nonmyopic+experimental+design%22+OR+abs%3a%22Bayesian+structure+learning%22+OR+abs%3a%22posterior+over+DAGs%22+OR+abs%3a%22Bayesian+causal+discovery%22+OR+abs%3a%22causal+structure+learning%22+OR+abs%3a%22Markov+equivalence+class%22+OR+abs%3a%22conditional+independence+test%22+OR+abs%3a%22conditional+independence+testing%22+OR+abs%3a%22constraint-based+causal+discovery%22+OR+abs%3a%22d-separation%22+OR+abs%3a%22generalized+covariance+measure%22+OR+abs%3a%22generalised+covariance+measure%22+OR+abs%3a%22causal+Bayesian+optimization%22+OR+abs%3a%22causal+Bayesian+optimisation%22+OR+abs%3a%22causal+bandit%22+OR+abs%3a%22causal+bandits%22+OR+abs%3a%22intervention+target+selection%22+OR+abs%3a%22optimal+intervention+design%22+OR+abs%3a%22exploration+set%22+OR+abs%3a%22preferential+Bayesian+optimization%22+OR+abs%3a%22preferential+Bayesian+optimisation%22+OR+abs%3a%22preference-based+Bayesian+optimization%22+OR+abs%3a%22imperfect+expert%22+OR+abs%3a%22imperfect+experts%22+OR+abs%3a%22unreliable+expert%22+OR+abs%3a%22expert+reliability%22+OR+abs%3a%22counterfactual+identifiability%22+OR+abs%3a%22causal+abstraction%22+OR+abs%3a%22causal+hierarchy%22+OR+abs%3a%22cross-world%22+OR+abs%3a%22partial+identification+of+causal%22+OR+abs%3a%22semantic+entropy%22+OR+abs%3a%22semantic+uncertainty%22%29+OR+%28%28abs%3a%22simulation-based+inference%22+OR+abs%3a%22neural+posterior+estimation%22+OR+abs%3a%22prior-data+fitted+network%22+OR+abs%3a%22prior-fitted+network%22+OR+abs%3a%22amortized+inference%22+OR+abs%3a%22amortised+inferenc